<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Agentic Dominance</title>
  <style>
    :root {
      --bg: #08111f;
      --card: rgba(15, 23, 42, 0.92);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --ok: #22c55e;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: linear-gradient(180deg, #060b14 0%, #0b1323 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.35);
      color: #bbf7d0;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.8rem); }
    p { color: var(--muted); line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .button {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
    }
    .button.secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .fine { margin-top: 20px; font-size: 0.95rem; color: #94a3b8; }
    .error { color: #fecaca; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Payment received</div>
    <h1 id="title">Thank you for your purchase.</h1>
    <p id="description">Your payment has been received. Use the secure download button below to access your PDF. The file is only served after Stripe confirms your payment session.</p>
    <div class="actions">
      <a id="download-link" class="button" href="#">Download your product</a>
      <a class="button secondary" href="/">Return to sales page</a>
    </div>
    <p id="message" class="fine">Verifying your secure session…</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search)
    const sessionId = params.get('session_id')
    const product = params.get('product') || 'blueprint'
    const title = document.getElementById('title')
    const description = document.getElementById('description')
    const downloadLink = document.getElementById('download-link')
    const message = document.getElementById('message')

    const productConfig = {
      blueprint: {
        title: 'Thank you for purchasing the Blueprint.',
        description: 'Your payment has been received. Use the secure download button below to access your PDF. The file is only served after Stripe confirms your payment session.',
        button: 'Download Agentic Dominance Blueprint'
      },
      'complete-system': {
        title: 'Thank you for purchasing the Complete System.',
        description: 'Your payment has been received. Use the secure download button below to access your Complete System buyer guide and setup workbook. The file is only served after Stripe confirms your payment session.',
        button: 'Download Complete System Guide'
      },
      empire: {
        title: 'Thank you for purchasing Empire DFY Annual.',
        description: 'Your payment has been received. Use the secure download button below to access your Empire DFY annual guide and onboarding workbook. The file is only served after Stripe confirms your payment session.',
        button: 'Download Empire DFY Guide'
      }
    }

    const activeProduct = productConfig[product] || productConfig.blueprint
    title.textContent = activeProduct.title
    description.textContent = activeProduct.description
    downloadLink.textContent = activeProduct.button

    if (!sessionId) {
      downloadLink.removeAttribute('href')
      downloadLink.style.pointerEvents = 'none'
      downloadLink.style.opacity = '0.5'
      message.textContent = 'Missing session_id. Please return to the sales page or contact support if payment already completed.'
      message.classList.add('error')
    } else {
      downloadLink.href = `/api/download-product?product=${encodeURIComponent(product)}&session_id=${encodeURIComponent(sessionId)}`
      message.textContent = 'Your download link is ready. If the file does not start, your payment session may still be processing.'
    }
  </script>
</body>
</html>
